[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kosh"
version = "0.1.0"
description = "Portfolio intelligence for a mutual fund distributor (showcase MVP)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "casparser>=1.0",
    "openpyxl>=3.1",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["kosh*"]

[tool.setuptools.package-data]
kosh = ["demo/*.json", "marketdata/snapshot/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
